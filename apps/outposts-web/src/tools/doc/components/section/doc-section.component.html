@if (isResourceReady$ | async) {
  <markdown
    [data]="data$ | async"
    clipboard
    [lineNumbers]="lineNumbers"
    [katex]="!!(isKatexRequired$ | async)"
    [mermaid]="!!(isMermaidRequired$ | async)"
    [clipboardButtonComponent]="ClipboardButtonComponent"
    class="doc-markdown"
  >
  </markdown>
} @else if (!skeleton) {
  <div class="doc-skeleton">
    <app-skeleton width="50%" height="3em" class="mb-4" />
    <br />
    <br />
    <app-skeleton width="100%" height="1.5em" class="mb-2" />
    <app-skeleton width="100%" height="1.5em" class="mb-2" />
    <app-skeleton width="75%" height="1.5em" class="mb-2" />
    <br />
    <br />
    <app-skeleton width="100%" height="250px"></app-skeleton>
    <br />
    <br />
    <app-skeleton width="90%" height="1.5em" class="mb-2" />
    <app-skeleton width="100%" height="1.5em" class="mb-2" />
    <app-skeleton width="50%" height="1.5em" class="mb-2" />
    <br />
    <br />
    <ul class="m-0 p-0 list-none">
      <li class="mb-1">
        <div class="flex items-center">
          <app-skeleton shape="circle" size="0.5rem" class="mr-1"></app-skeleton>
          <div style="flex: 1">
            <app-skeleton width="50%" class="mb-1"></app-skeleton>
          </div>
        </div>
      </li>
      <li class="mb-1">
        <div class="flex items-center">
          <app-skeleton shape="circle" size="0.5rem" class="mr-1"></app-skeleton>
          <div style="flex: 1">
            <app-skeleton width="30%" class="mb-1"></app-skeleton>
          </div>
        </div>
      </li>
      <li class="mb-1">
        <div class="flex items-center">
          <app-skeleton shape="circle" size="0.5rem" class="mr-1"></app-skeleton>
          <div style="flex: 1">
            <app-skeleton width="60%" class="mb-1"></app-skeleton>
          </div>
        </div>
      </li>
    </ul>
    <br />
    <br />
    <app-skeleton width="70%" height="2em" class="mb-2" />
    <br />
    <br />
    <app-skeleton width="100%" height="1.5em" class="mb-2" />
    <app-skeleton width="75%" height="1.5em" class="mb-2" />
    <br />
    <div class="flex justify-between items-center gap-6">
      <app-skeleton class="flex-1" height="100px" />
      <app-skeleton class="flex-1" height="100px" />
      <app-skeleton class="flex-1" height="100px" />
    </div>
  </div>
}
