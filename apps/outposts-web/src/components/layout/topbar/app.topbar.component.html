<div class="layout-topbar">
  <div class="layout-topbar-inner">
    <div class="layout-topbar-logo-container">
      <a
        [routerLink]="['/']"
        class="layout-topbar-logo"
        [attr.aria-label]="'topbar.logoAriaLabel' | transloco"
      >
        <img width="150" height="30" src="image/logo-512-w.png" alt="" />
      </a>
      <a
        [routerLink]="['/']"
        class="layout-topbar-icon"
        [attr.aria-label]="'topbar.logoAriaLabel' | transloco"
      >
        <img width="30" height="30" src="image/logo-512.png" alt="" />
      </a>
    </div>

    <ul class="topbar-items">
      <li>
        <a
          href="https://github.com/ethaxon/outposts"
          target="_blank"
          rel="noopener noreferrer"
          class="topbar-item"
          [attr.aria-label]="'topbar.links.github' | transloco"
        >
          <ng-icon name="lucideGithub" aria-hidden="true" />
        </a>
      </li>
      <li>
        <a
          href="https://t.me/outposts_project"
          target="_blank"
          rel="noopener noreferrer"
          class="topbar-item"
          [attr.aria-label]="'topbar.links.telegram' | transloco"
        >
          <ng-icon name="lucideSend" aria-hidden="true" />
        </a>
      </li>
      <li>
        <a
          href="https://discord.gg/dj9teD6G"
          target="_blank"
          rel="noopener noreferrer"
          class="topbar-item"
          [attr.aria-label]="'topbar.links.discord' | transloco"
        >
          <ng-icon name="lucideMessageCircle" aria-hidden="true" />
        </a>
      </li>
      <li>
        <a
          href="https://github.com/ethaxon/outposts/discussions"
          target="_blank"
          rel="noopener noreferrer"
          class="topbar-item"
          [attr.aria-label]="'topbar.links.discussions' | transloco"
        >
          <ng-icon name="lucideMessagesSquare" aria-hidden="true" />
        </a>
      </li>
      <li>
        <button
          type="button"
          class="topbar-item"
          (click)="toggleDarkMode()"
          [attr.aria-label]="'topbar.toggleTheme' | transloco"
        >
          <ng-icon [name]="isDarkMode() ? 'lucideMoon' : 'lucideSun'" aria-hidden="true" />
        </button>
      </li>
      <li data-topbar-panel>
        <button
          (click)="togglePanel('language')"
          type="button"
          class="topbar-item version-item"
          [attr.aria-label]="'topbar.language' | transloco"
          [attr.aria-expanded]="activePanel() === 'language'"
        >
          <span class="version-text">{{ activeLangLabel() }}</span>
          <ng-icon class="version-icon" name="lucideChevronDown" aria-hidden="true" />
        </button>
        <div class="versions-panel" [class.hidden]="activePanel() !== 'language'">
          <ul>
            @for (lang of languages; track lang.id) {
              <li role="none">
                <button
                  type="button"
                  class="w-full text-left"
                  [class.font-bold]="lang.id === activeLang()"
                  (click)="setLanguage(lang.id)"
                >
                  {{ lang.label }}
                </button>
              </li>
            }
          </ul>
        </div>
      </li>
      <li data-topbar-panel>
        <button
          (click)="togglePanel('version')"
          type="button"
          class="topbar-item version-item"
          [attr.aria-expanded]="activePanel() === 'version'"
        >
          <span class="version-text">{{
            versions ? versions[0].name : ("topbar.latest" | transloco)
          }}</span>
          <ng-icon class="version-icon" name="lucideChevronDown" aria-hidden="true" />
        </button>
        <div class="versions-panel" [class.hidden]="activePanel() !== 'version'">
          <ul>
            @for (v of versions; track v) {
              <li role="none">
                <a [href]="v.url">
                  <span>{{ v.version }}</span>
                </a>
              </li>
            }
          </ul>
        </div>
      </li>
      @if (showMenuButton) {
        <li class="menu-button">
          <button
            type="button"
            class="topbar-item menu-button"
            (click)="toggleMenu()"
            [attr.aria-label]="'topbar.menu' | transloco"
          >
            <ng-icon name="lucideMenu" aria-hidden="true" />
          </button>
        </li>
      }
    </ul>
  </div>
</div>
