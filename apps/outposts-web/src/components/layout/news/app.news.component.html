@if (isNewsActive) {
  <div class="layout-news">
    <div class="layout-news-container">
      <div class="layout-news-content">
        <span class="layout-news-text">{{ announcement?.content | transloco }}</span>
      </div>
      <button type="button" class="layout-news-close" (click)="hideNews()">
        <ng-icon name="lucideX" aria-hidden="true" />
      </button>
    </div>
  </div>
}
