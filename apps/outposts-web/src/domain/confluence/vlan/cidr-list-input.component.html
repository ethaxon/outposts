<div
  class="flex min-h-8 w-full cursor-text flex-wrap items-center gap-1 rounded-lg border border-input bg-transparent px-1.5 py-1 transition-colors focus-within:border-ring focus-within:ring-3 focus-within:ring-ring/50 dark:bg-input/30"
  [class.border-destructive]="notice()?.kind === 'invalid'"
  [class.opacity-50]="disabled()"
  (click)="focus()"
>
  @for (value of values(); track value; let i = $index) {
    <span
      class="inline-flex items-center rounded-md bg-secondary font-mono text-xs text-secondary-foreground"
    >
      <button
        type="button"
        class="cursor-pointer py-0.5 pl-1.5 pr-1"
        [disabled]="disabled()"
        [attr.aria-label]="'confluence.workspace.vlan.cidr.edit' | transloco: { cidr: value }"
        (click)="edit(i); $event.stopPropagation()"
      >
        {{ value }}
      </button>
      <button
        type="button"
        class="flex cursor-pointer items-center self-stretch rounded-r-md px-1 opacity-60 hover:bg-destructive/15 hover:opacity-100"
        [disabled]="disabled()"
        [attr.aria-label]="'confluence.workspace.vlan.cidr.remove' | transloco: { cidr: value }"
        (click)="remove(i); $event.stopPropagation()"
      >
        <ng-icon name="lucideX" size="0.75rem" aria-hidden="true" />
      </button>
    </span>
  }
  <input
    #field
    class="h-6 min-w-36 flex-1 bg-transparent px-1 font-mono text-sm outline-none placeholder:font-sans placeholder:text-muted-foreground"
    autocomplete="off"
    autocapitalize="off"
    spellcheck="false"
    [id]="inputId()"
    [value]="draft()"
    [placeholder]="values().length ? '' : placeholder()"
    [disabled]="disabled()"
    [attr.aria-invalid]="notice()?.kind === 'invalid'"
    (input)="onInput(field.value)"
    (keydown)="onKeydown($event)"
    (paste)="onPaste($event)"
    (blur)="onBlur()"
  />
</div>
@if (notice(); as n) {
  <p
    class="mt-1 text-xs"
    [class.text-destructive]="n.kind === 'invalid'"
    [class.text-muted-foreground]="n.kind !== 'invalid'"
    [attr.role]="n.kind === 'invalid' ? 'alert' : 'status'"
  >
    {{ "confluence.workspace.vlan.cidr." + n.kind | transloco: n }}
  </p>
} @else {
  <p class="mt-1 text-xs text-muted-foreground">
    {{ "confluence.workspace.vlan.cidr.hint" | transloco }}
  </p>
}
